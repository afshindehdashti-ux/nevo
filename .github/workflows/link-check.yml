name: Link & Sitemap Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily 07:00 UTC — catches external URL rot without blocking PRs.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Also validate external URLs"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  check-links:
    name: Static route/link/sitemap check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fast, hermetic check on every push/PR — internal links, sitemap, redirects.
      - name: Run link checker (offline)
        id: linkcheck
        run: pnpm check:links
        continue-on-error: true

      # Full check (adds external URL validation) on cron + manual dispatch.
      - name: Run link checker (full, external URLs)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        id: linkcheck_full
        run: pnpm check:links:full
        continue-on-error: true

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: reports/link-check/
          if-no-files-found: warn

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: nevo-link-check
          path: reports/link-check/summary.md

      - name: Fail job if link check failed
        if: steps.linkcheck.outcome == 'failure' || steps.linkcheck_full.outcome == 'failure'
        run: exit 1
