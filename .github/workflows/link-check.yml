name: Link & Sitemap Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-links:
    name: Static route/link/sitemap check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Script is pure Node (no deps needed), but keep install so a future
      # extension can import from the project without a cold path.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run link checker
        run: bun run check:links
