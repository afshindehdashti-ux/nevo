name: Link & Sitemap Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-links:
    name: Static route/link/sitemap check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run link checker
        id: linkcheck
        run: bun run check:links
        continue-on-error: true
      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: reports/link-check/
          if-no-files-found: warn
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: nevo-link-check
          path: reports/link-check/summary.md
      - name: Fail job if link check failed
        if: steps.linkcheck.outcome == 'failure'
        run: exit 1
