name: Solutions SEO weekly report

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to audit (defaults to published site)"
        required: false
        default: "https://nevo-engineering-hub.lovable.app"
      skip_on_preflight_failure:
        description: "If preflight fails, skip the audit instead of failing the workflow"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  weekly-snapshot:
    name: Weekly SEO snapshot (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pull the JSON from the most recent previous weekly run so we can diff.
      # continue-on-error so first-ever runs (no history) still succeed and
      # simply publish a baseline diff note.
      - name: Download previous weekly report
        id: prev
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: solutions-seo-weekly.yml
          workflow_conclusion: ""
          name_is_regexp: true
          name: ^solutions-seo-weekly-.*$
          path: reports/seo/previous
          if_no_artifact_found: warn

      - name: Locate previous JSON
        id: prev_json
        run: |
          PREV="$(find reports/seo/previous -maxdepth 3 -name 'solutions-seo-*.json' | head -n 1)"
          if [ -n "$PREV" ]; then
            echo "path=$PREV" >> "$GITHUB_OUTPUT"
            echo "Previous report: $PREV"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No previous report found — this run will be the baseline."
          fi

      # Fail fast if the live site is down or misconfigured. Cheaper than
      # running the full 60-page snapshot against a broken deploy, and the
      # error surfaces the exact failing URL in the run log / summary.
      #
      # continue-on-error lets us decide in the next step whether to skip
      # the rest of the job (default for scheduled runs) or fail hard.
      - name: Preflight — site + sitemap reachable
        id: preflight
        continue-on-error: true
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://nevo-engineering-hub.lovable.app' }}
          LOCALES: en,ar,tr
        run: python3 scripts/preflight_solutions_seo.py

      # Decide: skip cleanly (default) or fail the workflow.
      # Scheduled runs default to skip so the team doesn't get paged for
      # transient outages of the live site — the diff would be noise anyway.
      - name: Evaluate preflight outcome
        id: preflight_gate
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SKIP_ON_FAILURE: ${{ github.event.inputs.skip_on_preflight_failure || 'true' }}
        run: |
          if [ "$PREFLIGHT_OUTCOME" = "success" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Preflight passed — running full audit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SKIP_ON_FAILURE" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## ⚠️ Weekly audit skipped"
              echo ""
              echo "Preflight failed (live site or sitemap not reachable). Skipping the"
              echo "full snapshot for this week so the team is not paged on a transient"
              echo "outage. See the Preflight step above for the exact failing URL,"
              echo "HTTP status, and response time."
              echo ""
              echo "To force a hard failure instead, re-run via **Run workflow** with"
              echo "\`skip_on_preflight_failure = false\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Preflight failed — skipping weekly audit (skip_on_preflight_failure=true)."
            exit 0
          fi
          echo "::error::Preflight failed and skip_on_preflight_failure=false — failing the workflow."
          exit 1

      # Run against the live published site — no local Vite boot required.
      # --warn-only keeps the scheduled run green so a regression doesn't
      # spam the team with failed-workflow emails; the report is the deliverable.

      - name: Verify Solutions SEO (live)
        if: steps.preflight_gate.outputs.skip != 'true'
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://nevo-engineering-hub.lovable.app' }}
          REPORT_JSON: reports/seo/solutions-seo.json
          REPORT_HTML: reports/seo/solutions-seo.html
        run: REPORT_MD="$GITHUB_STEP_SUMMARY" python3 scripts/verify_solutions_seo.py --warn-only

      # Highlight ONLY new / resolved issues since the previous weekly run.
      - name: Diff against previous run
        if: steps.preflight_gate.outputs.skip != 'true'
        run: |
          python3 scripts/diff_solutions_seo.py \
            --previous "${{ steps.prev_json.outputs.path }}" \
            --current reports/seo/solutions-seo.json \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Stamp report filename with ISO week
        if: steps.preflight_gate.outputs.skip != 'true'
        run: |
          WEEK="$(date -u +'%Y-W%V')"
          echo "REPORT_WEEK=$WEEK" >> "$GITHUB_ENV"
          cp reports/seo/solutions-seo.html "reports/seo/solutions-seo-${WEEK}.html"
          cp reports/seo/solutions-seo.json "reports/seo/solutions-seo-${WEEK}.json"

      # One-glance index: every failing URL in a single table. Written both to
      # the run summary (fast triage in the browser) and to a Markdown artifact
      # (readable offline, shareable in Slack/email threads).
      - name: Build consolidated failure index
        if: steps.preflight_gate.outputs.skip != 'true'
        run: |
          python3 scripts/index_solutions_seo.py \
            --input reports/seo/solutions-seo.json \
            --out "reports/seo/solutions-seo-index-${REPORT_WEEK}.md" \
            --append "$GITHUB_STEP_SUMMARY" \
            --title "Consolidated failure index — weekly ${REPORT_WEEK}"

      # 90-day retention so the team can compare week-over-week.
      - name: Upload weekly SEO report
        if: steps.preflight_gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: solutions-seo-weekly-${{ env.REPORT_WEEK }}
          path: |
            reports/seo/solutions-seo-*.html
            reports/seo/solutions-seo-*.json
            reports/seo/solutions-seo-index-*.md
          retention-days: 90
          if-no-files-found: error

      # Notify Slack when the live snapshot finds regressions.
      # Runs after upload so the "View run & artifacts" link resolves.
      - name: Notify Slack on failure
        if: always() && steps.preflight_gate.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_JSON: reports/seo/solutions-seo.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_LABEL: weekly ${{ env.REPORT_WEEK }}
        run: python3 scripts/notify_solutions_seo.py
