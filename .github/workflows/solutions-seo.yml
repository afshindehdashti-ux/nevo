name: Solutions SEO snapshot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_on_preflight_failure:
        description: "If preflight fails, skip the audit instead of failing the check"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  seo-snapshot:
    name: Canonical / og / twitter / hreflang (Solutions × 10 locales)
    runs-on: ubuntu-latest
    # Default to hard-fail on PRs (a broken dev server is a real regression),
    # but allow overriding via workflow_dispatch input or a repo variable
    # (vars.SEO_SKIP_ON_PREFLIGHT_FAILURE=true) for temporary infra outages.
    env:
      SKIP_ON_PREFLIGHT_FAILURE: ${{ github.event.inputs.skip_on_preflight_failure || vars.SEO_SKIP_ON_PREFLIGHT_FAILURE || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Boot Vite dev in the background and wait for the port.
      - name: Start Vite dev server
        run: |
          nohup bun run dev --port 4323 --host 127.0.0.1 > vite.log 2>&1 &
          echo $! > vite.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4323/ -o /dev/null; then
              echo "vite is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::Vite did not start in 60s"
          tail -n 200 vite.log || true
          exit 1

      # Fail fast if the local dev server is up but serving broken routes /
      # sitemap. Cheaper than running the 60-page snapshot against a broken
      # build, and the error surfaces the exact failing URL in the run log.
      #
      # continue-on-error so the next step can decide whether a preflight
      # failure should skip cleanly (opt-in) or fail the PR check (default).
      - name: Preflight — site + sitemap reachable
        id: preflight
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:4323
          LOCALES: en,ar,tr
          TIMEOUT_SECONDS: "10"
          RETRIES: "2"
          # Enable heatmap export so the built-in heatmap × breakdown × raw
          # cross-check runs. The validation JSON is inspected in a dedicated
          # gate step below so a mismatch fails the build even when
          # skip_on_preflight_failure=true.
          HEATMAP_CSV_PATH: reports/seo/heatmap.csv
          HEATMAP_JSON_PATH: reports/seo/heatmap.json
          VALIDATION_JSON_PATH: reports/seo/heatmap-validation.json
        run: python3 scripts/preflight_solutions_seo.py

      # Hard-fail on any heatmap/breakdown/raw mismatch, regardless of the
      # skip_on_preflight_failure toggle — a divergence is a classification bug
      # in the tooling itself, not a transient site outage.
      - name: Enforce heatmap validation
        if: always() && hashFiles('reports/seo/heatmap-validation.json') != ''
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = "reports/seo/heatmap-validation.json"
          with open(path) as fh:
              data = json.load(fh)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## Heatmap validation",
              "",
              f"- combos: **{data['total_combos']}**",
              f"- mismatches: **{data['mismatch_count']}**",
              f"- status: {'✅ ok' if data['ok'] else '❌ mismatch'}",
              "",
          ]
          if not data["ok"]:
              lines.append("| error_kind | status_class | heatmap | breakdown | raw | status |")
              lines.append("|---|---|---:|---:|---:|---|")
              for c in data["combos"]:
                  if c["status"] == "ok":
                      continue
                  lines.append(
                      f"| `{c['error_kind']}` | `{c['status_class']}` | "
                      f"{c['actual']} | {c['expected']} | {c['raw']} | {c['status']} |"
                  )
          if summary:
              with open(summary, "a") as fh:
                  fh.write("\n".join(lines) + "\n")
          if not data["ok"]:
              print(f"::error::Heatmap validation failed: {data['mismatch_count']} mismatch(es). "
                    f"See {path} artifact.", file=sys.stderr)
              sys.exit(1)
          print(f"Heatmap validation OK ({data['total_combos']} combo(s)).")
          PY


      - name: Evaluate preflight outcome
        id: preflight_gate
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          if [ "$PREFLIGHT_OUTCOME" = "success" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Preflight passed — running SSR snapshot." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SKIP_ON_PREFLIGHT_FAILURE" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## ⚠️ SEO snapshot skipped"
              echo ""
              echo "Preflight failed (local Vite server or a sample route not reachable)."
              echo "Skipping the SSR snapshot because \`skip_on_preflight_failure=true\`."
              echo "See the Preflight step above for the exact failing URL, HTTP status,"
              echo "and response time."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Preflight failed — skipping SEO snapshot (skip_on_preflight_failure=true)."
            exit 0
          fi
          echo "::error::Preflight failed. Set skip_on_preflight_failure=true (workflow input or vars.SEO_SKIP_ON_PREFLIGHT_FAILURE) to skip instead of failing."
          exit 1

      # Run the SSR SEO snapshot. On failure, exit 1 fails the job -> red PR check.
      # Emits a JSON artifact and a Markdown block appended to the PR/run summary.
      - name: Verify Solutions SEO (SSR snapshot)
        if: steps.preflight_gate.outputs.skip != 'true'
        env:
          BASE_URL: http://127.0.0.1:4323
          REPORT_JSON: reports/seo/solutions-seo.json
          REPORT_HTML: reports/seo/solutions-seo.html
          REPORT_MD: ${{ github.step_summary }}
        run: python3 scripts/verify_solutions_seo.py

      - name: Stop Vite dev server
        if: always()
        run: |
          if [ -f vite.pid ]; then kill "$(cat vite.pid)" || true; fi

      # One-glance index: every failing URL in a single table, appended to the
      # PR run summary AND uploaded as an artifact for offline review.
      - name: Build consolidated failure index
        if: always() && steps.preflight_gate.outputs.skip != 'true'
        run: |
          python3 scripts/index_solutions_seo.py \
            --input reports/seo/solutions-seo.json \
            --out reports/seo/solutions-seo-index.md \
            --append "$GITHUB_STEP_SUMMARY" \
            --title "Consolidated failure index"

      # Notify Slack when there are failures. No-op if SLACK_WEBHOOK_URL is unset
      # (feature is opt-in — add the webhook as a repo secret to enable).
      - name: Notify Slack on failure
        if: always() && steps.preflight_gate.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_JSON: reports/seo/solutions-seo.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_LABEL: ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('{0}@{1}', github.ref_name, github.sha) }}
        run: python3 scripts/notify_solutions_seo.py


      - name: Upload SEO snapshot report
        if: always() && steps.preflight_gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: solutions-seo-report
          path: |
            reports/seo/solutions-seo.json
            reports/seo/solutions-seo.html
            reports/seo/solutions-seo-index.md
            vite.log
          if-no-files-found: warn
          retention-days: 30
