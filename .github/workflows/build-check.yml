name: Build Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    name: build:dev (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run build:dev with diagnostics
        id: build
        run: |
          mkdir -p build-logs
          set -o pipefail
          bun run build:dev:diagnose 2>&1 | tee build-logs/build-dev.log

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Surface failure summary
        if: failure()
        run: |
          echo "::error title=build:dev failed::Vite build failed. See 'Run build:dev with diagnostics' step above for the exact failing file/module and unresolved import (printed under '📍 Likely offender(s)'). Full log is attached as the 'build-dev-diagnostics' artifact on this run."
          exit 1
