name: Build Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    name: build:dev (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute cache keys
        id: cache-keys
        run: |
          BUN_VERSION="$(bun --version)"
          echo "bun-version=${BUN_VERSION}" >> "$GITHUB_OUTPUT"
          LOCK_HASH="${{ hashFiles('bun.lock', 'package.json') }}"
          echo "primary=${{ runner.os }}-bun-${BUN_VERSION}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
          echo "restore=${{ runner.os }}-bun-${BUN_VERSION}-" >> "$GITHUB_OUTPUT"

      - name: Restore Bun cache (global store + node_modules)
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ steps.cache-keys.outputs.primary }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.restore }}
            ${{ runner.os }}-bun-

      - name: Report cache status
        run: |
          echo "Bun version:  ${{ steps.cache-keys.outputs.bun-version }}"
          echo "Cache key:    ${{ steps.cache-keys.outputs.primary }}"
          echo "Cache hit:    ${{ steps.bun-cache.outputs.cache-hit }}"
          echo "Matched key:  ${{ steps.bun-cache.outputs.cache-matched-key }}"
          if [ -d node_modules ]; then
            echo "node_modules: present ($(find node_modules -maxdepth 1 -mindepth 1 -type d | wc -l) top-level packages)"
          else
            echo "node_modules: missing (will be populated by bun install)"
          fi
          {
            echo "### Bun dependency cache"
            echo ""
            echo "- **Bun**: \`${{ steps.cache-keys.outputs.bun-version }}\`"
            echo "- **Key**: \`${{ steps.cache-keys.outputs.primary }}\`"
            echo "- **Hit**: \`${{ steps.bun-cache.outputs.cache-hit || 'false' }}\`"
            echo "- **Matched key**: \`${{ steps.bun-cache.outputs.cache-matched-key || '(none)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          START=$SECONDS
          bun install --frozen-lockfile || bun install
          echo "bun install took $((SECONDS-START))s"
          echo "- **Install time**: \`$((SECONDS-START))s\`" >> "$GITHUB_STEP_SUMMARY"

      - name: TypeScript typecheck
        id: typecheck
        run: |
          mkdir -p build-logs
          set -o pipefail
          START=$SECONDS
          # `--pretty false` keeps output diff-clean; the reviewdog-style prefix
          # `file(line,col): error TSxxxx: message` is auto-matched by the
          # GitHub Actions TSC problem matcher, so failures annotate the PR.
          bun run typecheck --pretty false 2>&1 | tee build-logs/typecheck.log
          echo "- **typecheck time**: \`$((SECONDS-START))s\`" >> "$GITHUB_STEP_SUMMARY"

      - name: ESLint
        id: lint
        # Run even if typecheck failed so contributors see all issues in one run.
        if: always() && steps.typecheck.conclusion != 'skipped'
        run: |
          mkdir -p build-logs
          set -o pipefail
          START=$SECONDS
          # `--format=stylish` for humans + a second pass that emits GitHub
          # annotations (`::error file=…,line=…,col=…::message`) inline on the PR.
          bun run lint --format=stylish 2>&1 | tee build-logs/lint.log || LINT_EXIT=$?
          bunx eslint . --format=@microsoft/eslint-formatter-sarif -o build-logs/eslint.sarif 2>/dev/null || true
          bunx eslint . --format=compact 2>/dev/null | awk -F': ' '
            /: line [0-9]+, col [0-9]+, (Error|Warning) -/ {
              match($0, /^(.*): line ([0-9]+), col ([0-9]+), (Error|Warning) - (.*)$/, a);
              lvl = (a[4]=="Error") ? "error" : "warning";
              printf("::%s file=%s,line=%s,col=%s::%s\n", lvl, a[1], a[2], a[3], a[5]);
            }' || true
          echo "- **lint time**: \`$((SECONDS-START))s\`" >> "$GITHUB_STEP_SUMMARY"
          exit ${LINT_EXIT:-0}

      - name: Run build:dev with diagnostics
        id: build
        # Skip the build only if typecheck/lint failed — no point spending
        # minutes on Vite when the code doesn't compile or lint clean.
        if: success()
        run: |
          mkdir -p build-logs
          set -o pipefail
          START=$SECONDS
          bun run build:dev:diagnose 2>&1 | tee build-logs/build-dev.log
          echo "- **build:dev time**: \`$((SECONDS-START))s\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Surface failure summary
        if: failure()
        run: |
          echo "::error title=CI check failed::One of typecheck / lint / build:dev failed. Inline PR annotations point at the exact locations; full logs are attached as the 'build-dev-diagnostics' artifact (typecheck.log, lint.log, build-dev.log)."
          exit 1
