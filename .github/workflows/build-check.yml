name: Build Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    name: build:dev (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Report package manager
        run: |
          PNPM_VERSION="$(pnpm --version)"
          echo "pnpm version: ${PNPM_VERSION}"
          {
            echo "### Dependency setup"
            echo ""
            echo "- **Node.js**: \`$(node --version)\`"
            echo "- **pnpm**: \`${PNPM_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: |
          START=$SECONDS
          pnpm install --frozen-lockfile
          echo "pnpm install took $((SECONDS-START))s"
          echo "- **Install time**: \`$((SECONDS-START))s\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prettier format check
        id: format
        run: |
          mkdir -p build-logs
          set -o pipefail
          START=$SECONDS
          pnpm format:check 2>&1 | tee build-logs/prettier.log || FORMAT_EXIT=$?
          echo "- **format check time**: \`$((SECONDS-START))s\` (exit=${FORMAT_EXIT:-0})" >> "$GITHUB_STEP_SUMMARY"
          exit ${FORMAT_EXIT:-0}

      - name: TypeScript typecheck
        id: typecheck
        run: |
          mkdir -p build-logs
          set -o pipefail
          START=$SECONDS
          # `--pretty false` keeps output diff-clean; the reviewdog-style prefix
          # `file(line,col): error TSxxxx: message` is auto-matched by the
          # GitHub Actions TSC problem matcher, so failures annotate the PR.
          pnpm typecheck --pretty false 2>&1 | tee build-logs/typecheck.log
          echo "- **typecheck time**: \`$((SECONDS-START))s\`" >> "$GITHUB_STEP_SUMMARY"

      - name: ESLint
        id: lint
        # Run even if an earlier gate failed so contributors see all issues in one run.
        # Lint is now blocking: both errors and warnings fail the build (--max-warnings=0).
        if: always()
        run: |
          mkdir -p build-logs
          set -o pipefail
          START=$SECONDS
          pnpm exec eslint . --format=stylish 2>&1 | tee build-logs/lint.log || LINT_EXIT=$?
          # Emit `::error/::warning file=…,line=…,col=…::message` per finding so
          # they render inline on the PR "Files changed" tab.
          pnpm exec eslint . --format=compact 2>/dev/null | awk '
            match($0, /^(.*): line ([0-9]+), col ([0-9]+), (Error|Warning) - (.*)$/, a) {
              lvl = (a[4]=="Error") ? "error" : "warning";
              printf("::%s file=%s,line=%s,col=%s::%s\n", lvl, a[1], a[2], a[3], a[5]);
            }' || true
          echo "- **lint time**: \`$((SECONDS-START))s\` (exit=${LINT_EXIT:-0})" >> "$GITHUB_STEP_SUMMARY"
          exit ${LINT_EXIT:-0}

      - name: Run build:dev with diagnostics
        id: build
        # Skip the build if any blocking gate (format, typecheck, lint) failed.
        if: steps.format.conclusion == 'success' && steps.typecheck.conclusion == 'success' && steps.lint.conclusion == 'success'
        run: |
          mkdir -p build-logs
          set -o pipefail
          START=$SECONDS
          pnpm build:dev:diagnose 2>&1 | tee build-logs/build-dev.log
          echo "- **build:dev time**: \`$((SECONDS-START))s\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Prettier log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prettier-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/prettier.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload typecheck log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/typecheck.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload lint log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/lint.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build:dev log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-logs/build-dev.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Surface failure summary
        if: failure()
        run: |
          echo "::error title=CI check failed::One of format / typecheck / lint / build:dev failed. Inline PR annotations point at the exact locations; individual logs are uploaded as artifacts: prettier-log, typecheck-log, lint-log, build-dev-log."
          exit 1
