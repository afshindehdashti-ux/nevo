name: Refresh pnpm lockfile

on:
  push:
    branches:
      - codex/backend-connection-hardening

permissions:
  contents: write

concurrency:
  group: refresh-pnpm-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile and remove this workflow
        run: |
          rm .github/workflows/ci-refresh-pnpm-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A pnpm-lock.yaml pnpm-workspace.yaml package.json .github/workflows/ci-refresh-pnpm-lockfile.yml
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "chore: refresh pnpm lockfile"
          git push
