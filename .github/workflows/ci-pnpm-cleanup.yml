name: One-time pnpm formatting cleanup

on:
  push:
    branches:
      - codex/backend-connection-hardening

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format and fix lint
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .
          pnpm exec eslint . --fix
          rm .github/workflows/ci-pnpm-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "ci: format source with pnpm"
          git push origin "HEAD:${{ github.ref_name }}"
